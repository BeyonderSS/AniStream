name: Build & release APK

# Every push to main builds a signed release APK and publishes it as a GitHub release.
on:
  push:
    branches: [main]
    # server/ deploys separately; only app changes cut an APK release
    paths: ['android/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

jobs:
  release:
    # stable releases come from main only; feature branches must not cut them
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Next number = latest stable release + 1. GITHUB_RUN_NUMBER also counted feature-branch runs and made the
      # numbers jump (v1.0.17 -> v1.0.26); stable tags only move on main. versionCode stays 100 + N for the in-app updater.
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --exclude-pre-releases --limit 50 --json tagName -q '[.[].tagName | select(test("^v1\\.0\\.[0-9]+$")) | ltrimstr("v1.0.") | tonumber] | max // 0')
          n=$((last + 1))
          echo "VERSION_NAME=1.0.$n" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + n))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:parser:testDebugUnitTest

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          REELM_API_URL: ${{ vars.REELM_API_URL }}
        run: |
          ./gradlew assemblePhoneRelease assembleTvRelease
          mv app/build/outputs/apk/phone/release/app-phone-release.apk "Reelm-v$VERSION_NAME.apk"
          mv app/build/outputs/apk/tv/release/app-tv-release.apk "Reelm-TV-v$VERSION_NAME.apk"
          sha256sum Reelm-*.apk | tee checksum.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated build of \`${GITHUB_SHA::7}\`: $(git log -1 --pretty=%s)"
            echo
            echo "**Phone:** \`Reelm-v$VERSION_NAME.apk\` (Android 8.0+). Installs over earlier releases."
            echo
            echo "**Android TV / Fire TV:** \`Reelm-TV-v$VERSION_NAME.apk\`. On Fire TV: install the *Downloader* app, enable *Install unknown apps* for it, and open this release's APK link."
            echo
            echo '```'
            cat checksum.txt
            echo '```'
          } > notes.md
          gh release create "v$VERSION_NAME" Reelm-*.apk \
            --title "Reelm v$VERSION_NAME" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
