name: Build & release APK

# Every push to main builds a signed release APK and publishes it as a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # v1.0.0 was the first manual release; CI builds count up from there
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ 100 + github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:parser:testDebugUnitTest

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "AniStream-v$VERSION_NAME.apk"
          sha256sum "AniStream-v$VERSION_NAME.apk" | tee checksum.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated build of \`${GITHUB_SHA::7}\`: $(git log -1 --pretty=%s)"
            echo
            echo "**Install:** download \`AniStream-v$VERSION_NAME.apk\` and open it on your phone (Android 8.0+). It installs over any earlier CI release."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 checksum.txt)\`"
          } > notes.md
          gh release create "v$VERSION_NAME" "AniStream-v$VERSION_NAME.apk" \
            --title "AniStream v$VERSION_NAME" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
