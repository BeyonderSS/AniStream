name: Build & release APK

# Every push to main builds a signed release APK and publishes it as a GitHub release.
# Every push to a feature/** branch publishes the same build as a pre-release (never marked latest).
on:
  push:
    branches: [main, 'feature/**']
    # server/ deploys separately; only app changes cut an APK release
    paths: ['android/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.0.0 was the first manual release (versionCode 1); CI builds count up from there
      - name: Version
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            slug=$(echo "${GITHUB_REF_NAME#feature/}" | tr -c 'A-Za-z0-9\n' '-' | sed 's/-*$//' | cut -c1-30)
            echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER-$slug" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            echo "SLUG=$slug" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:parser:testDebugUnitTest

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          REELM_API_URL: ${{ vars.REELM_API_URL }}
        run: |
          ./gradlew assemblePhoneRelease assembleTvRelease
          mv app/build/outputs/apk/phone/release/app-phone-release.apk "Reelm-v$VERSION_NAME.apk"
          mv app/build/outputs/apk/tv/release/app-tv-release.apk "Reelm-TV-v$VERSION_NAME.apk"
          sha256sum Reelm-*.apk | tee checksum.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated build of \`${GITHUB_SHA::7}\`: $(git log -1 --pretty=%s)"
            echo
            echo "**Phone:** \`Reelm-v$VERSION_NAME.apk\` (Android 8.0+). Installs over earlier releases."
            echo
            echo "**Android TV / Fire TV:** \`Reelm-TV-v$VERSION_NAME.apk\`. On Fire TV: install the *Downloader* app, enable *Install unknown apps* for it, and open this release's APK link."
            echo
            echo '```'
            cat checksum.txt
            echo '```'
            # pre-releases carry the branch's latest web preview link (written by preview.yml), never a main release
            link=""
            if [ -n "${PRERELEASE:-}" ]; then link=$(gh release view "web-preview-$SLUG" --json body --jq .body 2>/dev/null || true); fi
            if [ -n "$link" ]; then echo; echo "$link"; fi
          } > notes.md
          if [ -n "${PRERELEASE:-}" ]; then flag=--prerelease; else flag=--latest; fi
          gh release create "v$VERSION_NAME" Reelm-*.apk \
            --title "Reelm v$VERSION_NAME${PRERELEASE:+ (pre-release)}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "$flag"
